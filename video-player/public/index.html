<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Video Player</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>My Videos</h1>
        <div class="controls-row">
          <button id="refreshBtn" title="Refresh list">⟳ Refresh</button>
        </div>
      </header>
      <div id="list" class="video-list" aria-live="polite">
        <!-- populated by app.js -->
      </div>
    </aside>

    <main class="player-area">
      <div class="player-shell hidden" id="playerShell">
        <div class="video-wrapper" id="videoWrapper">
          <video id="video" playsinline webkit-playsinline preload="metadata" ></video>

          <!-- clickable double-tap areas overlay -->
          <div id="doubleTapLeft" class="double-tap half left" aria-hidden="true"></div>
          <div id="doubleTapRight" class="double-tap half right" aria-hidden="true"></div>

          <!-- center play/pause button (appears together with seekBar) -->
          <button id="centerPlayBtn" class="center-play" aria-label="Play/Pause">▶</button>

          <!-- seek bar overlay (larger hit area; visible thin track is raised) -->
          <div id="seekBar" class="seekbar" aria-hidden="false">
            <div id="seekFill" class="seek-fill" style="width:0%"></div>
          </div>

          <div id="jumpOverlay" class="jump-overlay" aria-hidden="true"></div>
        </div>

        <div class="player-controls" id="controlsBar">
          <div class="left-controls">
            <button id="back5" title="Back 5s">⟲ 5s</button>
            <button id="forward5" title="Forward 5s">⟳ 5s</button>
            <span id="timeLabel">00:00 / 00:00</span>
          </div>

          <div class="right-controls">
            <select id="speedSelect" aria-label="Playback speed">
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="1.75">1.75×</option>
              <option value="2">2×</option>
              <option value="2.5">2.5×</option>
              <option value="3">3×</option>
            </select>

            <button id="fsBtn" title="Fullscreen">⤢</button>
            <a id="downloadBtn" class="download" title="Download" download>⬇ Download</a>
          </div>
        </div>
      </div>

      <div class="metadata" id="meta">
        <h2 id="metaTitle">Select a video</h2>
        <div id="metaInfo"></div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
