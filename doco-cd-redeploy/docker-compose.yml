services:
  app:
    image: ghcr.io/kimdre/doco-cd:0.93.1
    restart: always
    environment:
      TZ: Europe/Brussels
      LOG_LEVEL: debug
      PASS_ENV: "true"
      GIT_AUTH_DOMAINS_FILE: /run/secrets/auth_domains.txt
      SOPS_AGE_KEY_FILE: /run/secrets/keys.txt
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_LEVEL: info
      APPRISE_NOTIFY_URLS_FILE: /run/secrets/apprise_urls.txt
      POLL_CONFIG: |
        - url: "${MY_REPO_URL}"
          interval: 960
          reference: opal
          deployments:
            - name: "doco-cd"
              working_dir: "doco-cd/"
              compose_files:
                - docker-compose.yml
              reconciliation:
                enabled: true
                restart_timeout: 45
                restart_limit: 5
                restart_window: 600
              timeout: 300
              environment:
                BASEPATH: /data
                TZ: Europe/Brussels
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/root/.config/sops/age/keys.txt:/run/secrets/keys.txt:ro"
      - "./auth_domains.txt:/run/secrets/auth_domains.txt:ro"
      - "./apprise_urls.txt:/run/secrets/apprise_urls.txt:ro"
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      apprise:
        condition: service_healthy

  apprise:
    image: caronc/apprise:v1.5.0
    restart: always
    environment:
      TZ: Europe/Brussels
      APPRISE_STATEFUL_MODE: "disabled"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
