services:
  app:
    image: "grafana/grafana:latest"
    restart: "unless-stopped"
    user: "472"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/grafana:/var/lib/grafana"
      - "./config.yml:/etc/influxdb2/config.yml"
      - "./grafana.ini:/etc/grafana/grafana.ini"
    networks:
      - "system_internal"

  db:
    image: "influxdb:latest"
    ports:
      - '8086:8086'
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/influxdb:/var/lib/influxdb2"
    networks:
      - "system_internal"

  scraper:
    build: "./scraper/"
    restart: "unless-stopped"
    environment:
      # Scheduling: run once and exit 0 if unset
      CRON_SCHEDULE: ${CRON_SCHEDULE:-*/10 * * * *}
      TZ: ${TZ:-Europe/Brussels}
      INFLUX_URL: ${INFLUX_URL:-http://db:8086}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      INFLUX_ORG: ${INFLUX_ORG:-org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-wetter}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}

networks:
  system_internal:
    external: true
