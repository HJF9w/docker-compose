services:
  db:
    image: postgres:${POSTGRES_VERSION}
    restart: always
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - internal

  redis:
    image: redis:${REDIS_VERSION}
    restart: always
    command: redis-server --requirepass ${REDIS_HOST_PASSWORD}
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/redis:/data
    networks:
      - internal

  app:
    image: nextcloud:${NEXTCLOUD_VERSION}
    restart: always
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/html:/var/www/html
      # Custom PHP config if needed, usually fine out of box for FPM
      - ./php-custom.ini:/usr/local/etc/php/conf.d/nextcloud.ini:ro
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_HOST_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - OVERWRITEPROTOCOL=https
    depends_on:
      - db
      - redis
    networks:
      - internal

  web:
    image: nginx:${NGINX_VERSION}
    restart: always
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/html:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal
      - system_internal

  cron:
    image: nextcloud:${NEXTCLOUD_VERSION}
    restart: always
    entrypoint: /cron.sh
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/html:/var/www/html
    depends_on:
      - app
      - db
      - redis
    networks:
      - internal

  imaginary:
    image: nextcloud/aio-imaginary:${IMAGINARY_VERSION}
    restart: always
    environment:
      - PORT=9000
    command: -concurrency 10 -enable-url-source
    networks:
      - internal

networks:
  internal:
    internal: true
  system_internal:
    external: true
