##      - /etc/timezone:/etc/timezone:ro

  planewatch:
    image: ghcr.io/plane-watch/docker-plane-watch
    container_name: planewatch
    hostname: planewatch
    restart: always
    environment:
      - BEASTHOST=ultrafeeder
      - TZ=${FEEDER_TZ}
      - API_KEY=${PLANEWATCH_KEY}
      - DEBUG_LOGGING=true
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_FT}ft
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  adsbhub:
    image: ghcr.io/sdr-enthusiasts/docker-adsbhub
    container_name: adsbhub
    restart: always
    environment:
      - TZ=${FEEDER_TZ}
      - SBSHOST=ultrafeeder
      - CLIENTKEY=${ADSBHUB_STATION_KEY}

  # ----------------------------------------------------------------------
  # VISUALIZATION
  # ----------------------------------------------------------------------
  planefence:
    image: ghcr.io/sdr-enthusiasts/docker-planefence
    container_name: planefence
    hostname: planefence
    restart: always
    ports:
      - 8083:80
    environment:
      - TZ=${FEEDER_TZ}
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/planefence/config:/usr/share/planefence/persist
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/planefence/html:/usr/share/planefence/html
    tmpfs:
      - /run:rw,nosuid,nodev,exec,relatime,size=256M
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M

