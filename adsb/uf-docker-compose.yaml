services:
  app:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:telegraf-build-907
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 189:* rwm'
##    ports:
##      - 8080:80               # tar1090 map UI
##      - 9273-9274:9273-9274   # Prometheus stats interface
##      # Expose data ports for the server to connect to:
##      - 30005:30005           # Beast output for Server Feeders
##      - 30003:30003           # SBS output for ADSBHub
##      - 30105:30105           # MLAT input from Server Feeders
    environment:
      - LOGLEVEL=error
      - TZ=${FEEDER_TZ}
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_RTLSDR_DEVICE=${ADSB_SDR_SERIAL}
      - READSB_RTLSDR_PPM=${ADSB_SDR_PPM}
      - READSB_LAT=${FEEDER_LAT}
      - READSB_LON=${FEEDER_LONG}
      - READSB_ALT=${FEEDER_ALT_M}m
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      - READSB_GAIN=auto
      - ULTRAFEEDER_CONFIG=
          adsb,feed.adsb.fi,30004,beast_reduce_plus_out;
          adsb,in.adsb.lol,30004,beast_reduce_plus_out;
          adsb,feed.airplanes.live,30004,beast_reduce_plus_out;
          adsb,feed.planespotters.net,30004,beast_reduce_plus_out;
          adsb,feed.theairtraffic.com,30004,beast_reduce_plus_out;
          adsb,data.avdelphi.com,24999,beast_reduce_plus_out;
          adsb,skyfeed.hpradar.com,30004,beast_reduce_plus_out;
          adsb,dati.flyitalyadsb.com,4905,beast_reduce_plus_out;
          adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out,uuid=${ULTRAFEEDER_UUID};
          mlat,feed.adsb.fi,31090,39000;
          mlat,in.adsb.lol,31090,39001;
          mlat,feed.airplanes.live,31090,39002;
          mlat,mlat.planespotters.net,31090,39003;
          mlat,feed.theairtraffic.com,31090,39004;
          mlat,skyfeed.hpradar.com,31090,39005;
          mlat,dati.flyitalyadsb.com,30100,39007;
          mlat,feed.adsbexchange.com,31090,39008,uuid=${ULTRAFEEDER_UUID};
          mlat,data.avdelphi.com,26999,39009;
          mlathub,10.0.42.241,30105,beast_in;
          mlathub,10.0.42.241,30106,beast_in;
          mlathub,10.0.42.241,30107,beast_in;
          mlathub,10.0.42.241,30108,beast_in
      - UUID=${ULTRAFEEDER_UUID}
      - BEASTHOST=${EXT_IPV4}
      - MLAT_USER=${FEEDER_NAME}
      - UPDATE_TAR1090=true
      - TAR1090_DEFAULTCENTERLAT=${FEEDER_LAT}
      - TAR1090_DEFAULTCENTERLON=${FEEDER_LONG}
      - TAR1090_MESSAGERATEINTITLE=true
      - TAR1090_PAGETITLE=${FEEDER_NAME}
      - TAR1090_PLANECOUNTINTITLE=true
      - TAR1090_ENABLE_AC_DB=true
      - TAR1090_FLIGHTAWARELINKS=true
      - HEYWHATSTHAT_PANORAMA_ID=${FEEDER_HEYWHATSTHAT_ID}
      - HEYWHATSTHAT_ALTS=2280,10000,40000 ## Setting this via Portainer appears to be broken, variable values containing `,` don't get parsed
      - TAR1090_SITESHOW=true
      - TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE=true
      - TAR1090_RANGE_OUTLINE_WIDTH=2.0
      - TAR1090_RANGERINGSDISTANCES=10,25,50,100,175 ## Last value is furthest position ever, according to graps1090
      - TAR1090_RANGERINGSCOLORS='#1A237E','#0D47A1','#3e7ad6','#42A5F5','#64B5F6'
      - TAR1090_USEROUTEAPI=true
      - GRAPHS1090_DARKMODE=true
      - INFLUXDBV2_URL=${INFLUX_URL}
      - INFLUXDBV2_TOKEN=${INFLUX_TOKEN}
      - INFLUXDBV2_BUCKET=${INFLUX_BUCKET}
      - INFLUXDBV2_ORG=${INFLUX_ORG}
      - PROMETHEUS_ENABLE=true
      - READSB_ENABLE_BIASTEE=${READSB_ENABLE_BIASTEE}
      - TAR1090_CONFIGJS_APPEND=
          window.addEventListener('load', function() {
            var container = document.querySelector('#header_top .buttonContainer');
            if (!container) return;
            function createBtn(text, title, url) {
              var btn = document.createElement('span');
              btn.className = 'button inActiveButton';
              btn.title = title;
              btn.style.marginLeft = '5px';
              btn.innerHTML = '<span class="buttonText">' + text + '</span>';
              btn.onclick = function() { window.location.href = url; };
              return btn;
            }
            container.appendChild(createBtn('🔄', 'Replay Mode', '?replay'));
            container.appendChild(createBtn('⏺️', 'Heatmap', '?heatmap=99999&realHeat&heatDuration=24&heatEnd=0'));
            container.appendChild(createBtn('🅾️', 'Heatdot', '?heatmap=99999&heatDuration=24&heatEnd=0'));
            container.appendChild(createBtn('🔀', 'pTracks (Coverage)', '?pTracks=24'));
            container.appendChild(createBtn('⬅️', 'Full History', '?showTrace=2026-04-27'));
          });
      - PTRACKS=24
      - READSB_STATS_RANGE=${READSB_STATS_RANGE:-true}
      - READSB_RANGE_OUTLINE_HOURS=24
      - TAR1090_ENABLE_AC_DB=true
      - READSB_ENABLE_TRACES=${READSB_ENABLE_TRACES:-true} ## high disk usage
      - TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE=true
      - TAR1090_DWDLAYERS=dwd:RX-Produkt,dwd:NowCastMIX-Informationen,dwd:Warnungen_Gemeinden,dwd:Icon_reg025_fd_sl_VMAX_10M,dwd:Icon_reg025_fd_sl_CLCT,dwd:RBSN_VV,dwd:Radar_rv_product_1x1km_ger,dwd:SF-Produkt
      - GRAPHS1090_LARGE_WIDTH=1920
      - GRAPHS1090_LARGE_HEIGHT=1080
      - GRAPHS1090_SMALL_WIDTH=1920
      - GRAPHS1090_SMALL_HEIGHT=1080
      #- GRAPHS1090_REDUCE_IO=true
      #- GRAPHS1090_REDUCE_IO_FLUSH_IVAL=1h
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/ultrafeeder/globe_history:/var/globe_history
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/ultrafeeder/graphs1090:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /run:exec,size=256M
      - /tmp:size=128M
      - /var/log:size=32M
    networks:
      system_mac_vlan:
        ipv4_address: "${EXT_IPV4}"
        mac_address: "64:16:7F:49:1D:F2"
      system_internal:


networks:
  system_mac_vlan:
    external: true
  system_internal:
    external: true
