services:
  app:
    image: 'ubuntu/bind9:9.20-24.10_beta@sha256:d3cdf209e7664b1d27ac4090a465740dbb848ecf931e8af0576c4764356a1531'
    environment:
      - BIND9_USER=root
      - TZ=Europe/Berlin
    volumes:
      - "./.config:/etc/bind"
      - "./.cache:/var/cache/bind"
      - "./.records:/var/lib/bind"
      - "./.log:/var/log"
    restart: always
    networks:
      system_mac_vlan:
        ipv4_address: "${EXT_IPV4}"
      system_internal:
      to_unbound:

networks:
  system_mac_vlan:
    external: true
  system_internal:
    external: true
  to_unbound:
