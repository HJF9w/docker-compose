services:
  app:
    image: ghcr.io/kimdre/doco-cd:0.89.0
    restart: unless-stopped
    ports:
      - "80:80"     # Webhook endpoint
      - "9120:9120" # Prometheus metrics
    environment:
      ## PASS_ENV: true
      TZ: Europe/Brussels
      BASEPATH: "/data"
      GIT_AUTH_DOMAINS_FILE: /data/auth_domains.txt
      SOPS_AGE_KEY_FILE: /root/.config/sops/age/keys.txt
      POLL_CONFIG: |
        - url: "${MY_REPO_URL}"
          interval: 960  # 16 minutes in seconds
          reference: opal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - /root/.config/sops/age/keys.txt:/root/.config/sops/age/keys.txt:ro
      - ./auth_domains.txt:/data/auth_domains.txt:ro
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      mac_vlan:
      internal:

networks:
  internal:
    driver: "bridge"
  mac_vlan:
    driver: macvlan
    driver_opts:
      parent: "${MAC_VLAN_PARENT}"
    ipam:
      config:
        - subnet: "${IPAM_SUBNET}"
          gateway: "${IPAM_GATEWAY}"
          ip_range: "${IPAM_IP_RANGE}"
          aux_addresses:
            net_address: "${IPAM_NET_ADDRESS}"
