acl internal {
  10.0.42.0/24;
  192.168.178.0/24;
  127.0.0.0/8;
  172.16.0.0/12;
};

options {
  forwarders {
    9.9.9.9;
    1.1.1.1;
  };
  allow-query { internal; };
};

zone "home.arpa" IN {
  type master;
  file "/etc/bind/home-arpa.zone";
};

zone "fairmarkt" IN {
  type master;
  file "/etc/bind/fairmarkt.zone";
};

zone "ioui.eu" IN {
  type master;
  file "/etc/bind/ioui-eu.zone";
};
