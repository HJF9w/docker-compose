version: '3'
services:
  app:
    image: 'searxng/searxng@sha256:b4e34a39f76b1c860bbc53a0f35b10492029b2b18ef1d868df464fe43d7e0b93'
    restart: unless-stopped
    environment:
      - 'BASE_URL=https://searx.ioui.eu'
      - 'INSTANCE_NAME=opal-searx'
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}:/etc/searxng"
    networks:
      system_internal:

networks:
  system_internal:
    external: true
