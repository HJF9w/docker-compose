services:
  db:
    image: "postgres:16-alpine3.22"
    restart: "unless-stopped"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/db:/var/lib/postgresql/data"
    env_file:
      - "./.env"
    networks:
      - "default"

  app:
    image: "vabene1111/recipes:2.3.5"
    restart: "unless-stopped"
    env_file:
      - "./.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/staticfiles:/opt/recipes/staticfiles"
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/mediafiles:/opt/recipes/mediafiles"
    depends_on:
      - "db"
    networks:
      - "default"
      - "system_internal"

networks:
  default:
  system_internal:
    external: true

