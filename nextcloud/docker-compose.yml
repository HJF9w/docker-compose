services:
  db:
    image: mariadb:12.2
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: unless-stopped
    volumes:
      - ${BASEPATH}/nextcloud_db:/var/lib/mysql
    environment: ## Exec into db container as root -u 0 and use mariadb -u root -p where -p is MYSQL_ROOT_PASSWORD
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_PASSWORD=test
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      default:

  redis:
    image: redis:8.6-alpine3.23
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      default:

  app:
    image: nextcloud:33.0.1-apache
    restart: unless-stopped
    volumes:
      - ${BASEPATH}/nextcloud:/var/www/html
    environment:
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - MYSQL_PASSWORD=test
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - TRUSTED_PROXYS=192.168.178.0/24 172.18.0.0/16 10.10.10.0/8
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1
    healthcheck:
      test: ["CMD", "curl", "localhost"]
    depends_on:
      - db
      - redis
    networks:
      default:

  cron:
    image: nextcloud:33.0.1-apache
    restart: unless-stopped
    volumes:
      - ${BASEPATH}/nextcloud:/var/www/html
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis
    networks:
      default:


  proxy:
    image: 'jc21/nginx-proxy-manager:2.14.0'
    restart: unless-stopped
    ports: 
      - 80:80
      - 81:81
      - 443:443
    volumes:
      - '${BASEPATH}/nextcloud_nginx/data:/data'
      - '${BASEPATH}/nextcloud_nginx/letsencrypt:/etc/letsencrypt'
    networks:
      default:

networks:
  default:
