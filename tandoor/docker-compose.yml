version: '3'
services:
  tandoor: ## Rezepte!
    container_name: tandoor
    image: 'vabene1111/recipes:tandoor-v1-20260414'
    env_file:
      - ./.env
      - ./.envp
    volumes:
      - '/mnt/data/docker/tandoor/staticfiles:/opt/recipes/staticfiles'
      - '/mnt/data/docker/tandoor/mediafiles:/opt/recipes/mediafiles'
    hostname: tandoor
    restart: unless-stopped
    dns:
      - pihole
      - 10.10.10.1
    networks:
      - internal
      - tandoor-db

  tandoor-db:
    container_name: tandoor-db
    image: 'postgres:18.4-alpine3.22'
    env_file:
      - ./.env
      - ./.envp
    volumes:
      - '/mnt/data/docker/tandor-db/postgresql:/var/lib/postgresql/data'
    hostname: tandoor-db
    restart: unless-stopped
    dns: 
      - pihole
      - 10.10.10.1
    networks:
      - internal
    
networks:
  internal:
    driver: bridge
