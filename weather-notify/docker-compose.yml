services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # If you want to run once and exit, set CRON_EXPR: "" (empty)
      CRON_EXPR: ${CRON_EXPR:-0 6 * * *}
      TZ: ${TZ:-Europe/Brussels}
      LATITUDE: ${LATITUDE:-}
      LONGITUDE: ${LONGITUDE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      TIMEZONE: ${TIMEZONE:-Europe/Brussels}
      LOG_FILES: ${LOG_FILES:-/logs/dates.log,/logs/sy-dates.log}
      # Comma-separated ignore days or ranges. Example:
      # IGNORE_DAYS: ${IGNORE_DAYS:-2025-05-01,2025-05-04..2025-05-10}
      EVENT_TIME: ${EVENT_TIME:-10:00}
      EVENT_TZ: ${EVENT_TZ:-Europe/Brussels}
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/logs:/logs"
    healthcheck:
      test: ["CMD-SHELL", "test -w /logs && test -x /usr/local/bin/weather_notifier.py"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
