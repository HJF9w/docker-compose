---
services:
  app:
    image: vikunja/vikunja:2.7.0@sha256:e2204a1c1c6a81e833c2b3a5442be182ca2335b54c2e7e37578cc3fe12a27cfc
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/files:/app/vikunja/files
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/db:/db
    restart: unless-stopped
    networks:
      system_internal:

networks:
  system_internal:
    external: true
