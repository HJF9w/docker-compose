services:
  broker:
    image: 'redis:8'
    restart: 'unless-stopped'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/broker:/data:Z'
    networks:
      - 'default'

  db:
    image: 'postgres:18.4-alpine'
    restart: 'unless-stopped'
    volumes:
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/db_18:/var/lib/postgresql:Z'
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    networks:
      - 'default'

  gotenberg:
    image: 'gotenberg/gotenberg:8.34'
    restart: 'unless-stopped'
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - 'default'

  tika:
    image: 'apache/tika:3.3.1.0-full'
    restart: 'unless-stopped'
    networks:
      - 'default'

  server:
    image: 'ghcr.io/paperless-ngx/paperless-ngx:3.0.4'
    restart: 'unless-stopped'
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
#    ports:
#      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/usr/src/paperless/data:Z'
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/media:/usr/src/paperless/media:Z'
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/export:/usr/src/paperless/export:Z'
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/consume:/usr/src/paperless/consume:Z'
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/trash:/media/trash:Z' ## the trash directory has to be writable by the user running docker-compose, with 755 permissions.
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://paperless-broker-1:6379
      PAPERLESS_DBHOST: paperless-db-1
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg-1:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika-1:9998
      PAPERLESS_CONSUMER_POLLING: 20
      PAPERLESS_APP_TITLE: "FairMarkt Paperless"
    networks:
      - 'default'
      - 'system_internal'

networks:
  default:
  system_internal:
    external: true
