services:
  app:
    image: "n8nio/n8n:2.26.5"
    restart: unless-stopped
    environment:
      - N8N_HOST
      - N8N_PORT
      - N8N_PROTOCOL
      - WEBHOOK_URL
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - GENERIC_TIMEZONE=Europe/Brussels
      - N8N_DEFAULT_LOCALE=en-GB
      - N8N_FILE_ACCESS_WHITELIST=/shared,/tmp,/home/node/.n8n
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared;/tmp;/home/node/.n8n
      - N8N_DISABLE_FILESYSTEM_OPERATIONS=false
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/home/node/.n8n"
    networks:
      system_internal:
      internal:
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "postgres:18.3-alpine3.23"
    restart: unless-stopped
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/db:/var/lib/postgresql"
    networks:
      internal:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  system_internal:
    external: true
  internal:
