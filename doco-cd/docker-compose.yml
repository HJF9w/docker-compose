services:
  app:
    image: ghcr.io/kimdre/doco-cd:0.130.0@sha256:174e1a8d6c239d67e127e89f9a89842119b7a6c13be8e16bfe468e31b1dd6240
    restart: always
##    ports:
##      - "80:80"     # Webhook endpoint
##      - "9120:9120" # Prometheus metrics
    environment:
      TZ: Europe/Brussels
      LOG_LEVEL: debug
      PASS_ENV: "true"
      APPRISE_API_URL: http://apprise:8000/notify
      MAX_CONCURRENT_DEPLOYMENTS: "1"
      MAX_CONCURRENT_PREDEPLOYMENTS: "1"
      APPRISE_NOTIFY_LEVEL: info
      APPRISE_NOTIFY_URLS_FILE: /run/secrets/apprise_urls.txt
      GIT_AUTH_DOMAINS_FILE: /run/secrets/auth_domains.txt
      SOPS_AGE_KEY_FILE: /run/secrets/keys.txt
      API_SECRET_FILE: /run/secrets/api.txt
      SELF_UPDATE_ENABLED: true
      SELF_UPDATE_STRATEGY: applier
      POLL_CONFIG: |
        - url: "https://github.com/HJF9w/docker-bookstack.git"
          interval: 900
          reference: master
        - url: "ssh://git@git.ioui.eu/IOUI/docker-compose.git"
          interval: 360
          reference: opal
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/root/.config/sops/age/keys.txt:/run/secrets/keys.txt:ro"
      - "./auth_domains.txt:/run/secrets/auth_domains.txt:ro"
      - "./apprise_urls.txt:/run/secrets/apprise_urls.txt:ro"
      - "./api.txt:/run/secrets/api.txt:ro"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      internal:
    depends_on:
      apprise:
        condition: service_healthy

  apprise:
    image: caronc/apprise:2.0.1@sha256:0b2913b15c8eb47c25345722985ffbfae701326edde21909c205d296d62dd52c
    restart: always
    environment:
      TZ: Europe/Brussels
      APPRISE_STATEFUL_MODE: "disabled"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - internal

networks:
  internal:
    driver: "bridge"
    name: system_internal
  mac_vlan:
    driver: macvlan
    name: system_mac_vlan
    driver_opts:
      parent: "${MAC_VLAN_PARENT}"
    ipam:
      config:
        - subnet: "${IPAM_SUBNET}"
          gateway: "${IPAM_GATEWAY}"
          ip_range: "${IPAM_IP_RANGE}"
          aux_addresses:
            net_address: "${IPAM_NET_ADDRESS}"
