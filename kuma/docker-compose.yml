services:

  app:
    image: "louislam/uptime-kuma:2.5.3"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
 #    ports:
 #      - "3001:3001"
    hostname: kuma.ioui.eu
    restart: always
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    networks:
      default:
      system_internal:
      bookstack_default:

  mariadb:
    image: "mariadb:12.3.2-noble"
    restart: always
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/mysql:/var/lib/mysql"
    networks:
      default:

networks:
  default:
  system_internal:
    external: true
  bookstack_default:
    external: true


