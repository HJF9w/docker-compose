services:
  # ----------------------------------------------------------------------
  # COMMERCIAL & OTHER ADS-B FEEDERS
  # ----------------------------------------------------------------------
  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest-build-670@sha256:576da5db3f82a9153c64b1aff856a1e3da9040a8d9999e0c19e4b4f3362bfebe
    restart: unless-stopped
    env_file:
      - ".env"
      - "secrets.enc.env"
    ports:
      - 30105:30105
    networks:
      - system_internal
      - default
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest-build-862@sha256:b0b6b96adaa35f1670c324dbed071f68c025690ccc01d52a040ea8a3e102fb72
    restart: unless-stopped
    env_file:
      - ".env"
      - "secrets.enc.env"
    ports:
      - 30108:30106
    networks:
      - system_internal
      - default
    tmpfs:
      - /var/log

  pfclient:
    image: ghcr.io/sdr-enthusiasts/docker-planefinder:latest-build-544@sha256:f5b460366fbc54d083b965efcfb60437aec37c984224a39ee1256e3a72fb439b
    env_file:
      - ".env"
      - "secrets.enc.env"
    restart: unless-stopped
    networks:
      - system_internal
      - default

  airnavradar:
    image: ghcr.io/sdr-enthusiasts/docker-airnavradar:latest-build-887@sha256:f81a338fb4491815895db4e9a7d44e8bb573b42b803418016ee611c1852c309b
    env_file:
      - ".env"
      - "secrets.enc.env"
    restart: unless-stopped
    ports:
      - 30106:30105
    environment:
      - ALT=$${env.FEEDER_ALT_M}
    volumes: 
      - /sys/class/thermal/thermal_zone0/temp:/sys/class/thermal/thermal_zone0/temp:roz
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  planewatch:
    image: ghcr.io/plane-watch/docker-plane-watch:v0.0.10@sha256:f8cc3254943c3f0cd8b97d448bee929c87f3c78b9ecf1a61a255343797e61745
    env_file:
      - ".env"
      - "secrets.enc.env"
    restart: unless-stopped
    ports:
      - 30107:30105
    entrypoint: ["/bin/sh", "-c", "export ALT=$$FEEDER_ALT_FT; exec /init"]
    environment:
      - DEBUG_LOGGING=true
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  opensky:
    image: ghcr.io/sdr-enthusiasts/docker-opensky-network:latest-build-849@sha256:1b596f102a8d346a119de124c0fac95240f698cab021f88e0d4113d673f76ae4
    restart: unless-stopped
    env_file:
      - ".env"
      - "secrets.enc.env"
    environment:
      - DEBUG_LOGGING=true
      - ALT=$${env.FEEDER_ALT_M}
    tmpfs:
      - /run:exec,size=64M
      - /var/log

##  adsbhub: ## Website not working, couldn't get key
##    image: ghcr.io/sdr-enthusiasts/docker-adsbhub:latest-build-517
##    restart: unless-stopped
##    environment:
##      - SBSHOST=${FEEDER_IP}
##      - CLIENTKEY=${ADSBHUB_STATION_KEY}

  # ----------------------------------------------------------------------
  # VISUALIZATION
  # ----------------------------------------------------------------------
  planefence:
    image: ghcr.io/sdr-enthusiasts/docker-planefence:latest-build-1257@sha256:9c20a25fbcb465695e7ad62b3488e04d4b60498fd79d834ec5d54f8eaf433d27
    env_file:
      - ".env"
      - "secrets.enc.env"
    restart: unless-stopped
    networks:
      - system_internal
      - default
    environment:
      - ENABLE_WEB_CONFIG=true
      - PF_CONFIG_HTTP_PORT=9999
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/planefence/config:/usr/share/planefence/persist:z
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/planefence/html:/usr/share/planefence/html:z
    tmpfs:
      - /run:rw,nosuid,nodev,exec,relatime,size=256M
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M

  vrs:
    image: ghcr.io/sdr-enthusiasts/vrs:dev@sha256:54b568f29060ebbdaf298dddca2b64d2db7f9b8610833c068a853e2a8b456731
    restart: unless-stopped
    networks:
      - system_internal
      - default
    ports:
      #- 8091:8091
       - 49000-49099:49000-49099
    environment:
       - VRS_CULTURE=en-GB
       - VRS_DB_UPDATE_POLICY_FULLAUTO=yes
       - VRS_DB_UPDATE_WITH_VACUUM=yes
       - VRS_DB_UPDATE_BACKUP_UNCOMPRESSED=yes
    tmpfs:
       - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M
    volumes:
       - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/vrs:/root/.local/share/VirtualRadar
       - /etc/localtime:/etc/localtime:ro

networks:
  system_internal:
    external: true
