services:

  app:
    image: "louislam/uptime-kuma:2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
 #    ports:
 #      - "3001:3001"
    hostname: kuma.ioui.eu
    restart: always
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    networks:
      default:
      system_internal:
      bookstack_default:

  mariadb:
    image: "mariadb:12.3.3-noble@sha256:2bdff1534a7e569fecaf4b10b66ad0d410806e382d9db29ba305448addda97c4"
    restart: always
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/mysql:/var/lib/mysql"
    networks:
      default:

networks:
  default:
  system_internal:
    external: true
  bookstack_default:
    external: true


