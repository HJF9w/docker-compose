services:
  app:
    image: codeberg.org/forgejo/forgejo:17.0.0@sha256:06d38310de496a10186d952bdad5ca764c153c8023ede8dfa0944c79a1dc5412
    env_file:
      - "secrets.enc.env"
      - ".env"
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: unless-stopped
    networks:
      system_mac_vlan:
        ipv4_address: "${EXT_IPV4}"
        mac_address: 64:16:7F:69:CC:F6
      default:
      caddy_to_forgejo:
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/data
      - /etc/localtime:/etc/localtime:ro
##    ports:
##      - "3000:3000"
##      - "222:22"
    depends_on:
      - db
      - redis

  db:
    image: mariadb:12.3.3-noble@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    restart: unless-stopped
    env_file:
      - "secrets.enc.env"
      - ".env"
    networks:
      - default
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/mysql:/var/lib/mysql

  redis:
    image: valkey/valkey:9.1.0-alpine3.23@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02
    networks:
      - default
    restart: unless-stopped
    env_file:
      - "secrets.enc.env"

  dind:
    image: docker:29.5.3-dind-alpine3.23@sha256:7d85d0eda291f1a7ab6df4a9d1802b5ad4cf9145a088bd11188c78dcb5c7392b
    privileged: 'true'
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    restart: unless-stopped
    networks:
      - default

  runner:
    image: data.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
    networks:
      - default
    env_file:
      - ".env"
      - "secrets.enc.env"
    depends_on:
      dind:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://dind:2375
    user: 1000:1000
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/runner:/data
      - ./runner-config.enc.yml:/data/runner-config.yml
    restart: unless-stopped
    command: 'forgejo-runner daemon --config runner-config.yml'

  renovate:
    image: ghcr.io/renovatebot/renovate:44.180.0@sha256:ad97d11f73542932f3615dcfd8bc9637d20f80ebf6cc97d0d12a885a19bf3412
    environment:
      RENOVATE_CONFIG_FILE: /config.js
    volumes:
      - ./config.enc.js:/config.js:ro
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/renovate:/data
    networks:
      default:
    restart: no # Required for doco-cd job schedules
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "*/15 * * * *"
      cd.doco.job.execution_mode: "restart"
      cd.doco.job.wait_running_jobs: "false"
      cd.doco.job.skip_running: "true"
      cd.doco.job.notify_on: "failure"
    depends_on:
      - app

networks:
  default:
  system_mac_vlan:
    external: true
  caddy_to_forgejo:
    external: true

