version: 2
updates:
  - package-ecosystem: "docker-compose"
    target-branch: "master"
    directories:
      - "**/*"
    schedule:
      interval: "daily"

  ## Xenon 
  - package-ecosystem: "docker-compose"
    target-branch: "xenon"
    directories:
      - "**/*"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    target-branch: "xenon"
    directories:
      - "**/*"
    schedule:
      interval: "daily"

  ## Opal
  - package-ecosystem: "docker-compose"
    target-branch: "opal"
    directories:
      - "**/*"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    target-branch: "opal"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
