services:
  dashboard:
    image: nginx:1.31.1-alpine3.23
    restart: unless-stopped
    env_file:
      - ".env"
      - "secrets.enc.env"
    networks:
      - system_internal
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/usr/share/nginx/html
    volumes:
      - ./index.html.template:/etc/nginx/templates/index.html.template:z

networks:
  system_internal:
    external: true
