version: '3'
services:
  app:
    image: 'searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271'
    restart: unless-stopped
    environment:
      - 'BASE_URL=https://searx.ioui.eu'
      - 'INSTANCE_NAME=opal-searx'
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}:/etc/searxng"
    networks:
      system_internal:

networks:
  system_internal:
    external: true
