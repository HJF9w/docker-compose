version: 2
updates:
  - package-ecosystem: "docker-compose"
    target-branch: "master"
    directories:
      - "/portainer-ee"
    schedule:
      interval: "daily"

  ## Xenon 
  - package-ecosystem: "docker-compose"
    target-branch: "xenon"
    directories:
      - "/bind9"
      - "/caddy"
      - "/email-cleaner"
      - "/grafana"
      - "/it-tools"
      - "/kuma"
      - "/pdf-tools"
      - "/portainer-ce"
      - "/portainer-ee"
      - "/scraper-lange"
      - "/solar-downloader"
      - "/syncthing"
      - "/watchtower"
      - "/weather-notify"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    target-branch: "xenon"
    directories:
      - "/email-cleaner"
      - "/scraper-lange"
      - "/solar-downloader"
      - "/weather-notify"
    schedule:
      interval: "daily"

  ## Opal
  - package-ecosystem: "docker-compose"
    target-branch: "opal"
    directories:
      - "/searxng"
      - "/tandoor"
      - "/twitch-recorder"
      - "/video-player"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    target-branch: "opal"
    directories:
      - "/twitch-recorder"
      - "/video-player"
    schedule:
      interval: "daily"
