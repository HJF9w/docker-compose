services:
  app:
    image: 'portainer/portainer-ee:2.39.4'
    restart: always
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '${BASEPATH}/portainer/data:/data'
    networks:
      mac_vlan:
        ipv4_address: ${portainer_mac_vlan_ipv4}
      internal:


networks:
  internal:
    driver: bridge
  mac_vlan:
    driver: macvlan
    driver_opts:
      parent: ens18
    ipam:
      config:
      - subnet: ${subnet_default} 
        gateway: ${gateway_default}
        ip_range: ${ip_range}
        aux_addresses:
          net_address: ${host_address}
