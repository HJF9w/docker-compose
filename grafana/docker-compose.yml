services:
  app:
    image: "grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
    restart: "unless-stopped"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    user: "472"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/grafana:/var/lib/grafana"
      - "./config.yml:/etc/influxdb2/config.yml"
      - "./grafana.ini:/etc/grafana/grafana.ini"
    networks:
      - "system_internal"

  db:
    image: "influxdb:2.9.1@sha256:cdd3dbdea45c2f43513abd06ee9644b6e05d2354a2b93ca829c9f07d716eaaac"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    ports:
      - "8086:8086"
    restart: "unless-stopped"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/influxdb:/var/lib/influxdb2"
    networks:
      - "system_internal"
      - "internal"

  postgres:
    image: "postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7"
    restart: "unless-stopped"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/postgres:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      system_internal:
      internal:
      system_mac_vlan:
        ipv4_address: "${POSTGRES_EXT_IPV4}"

  pgadmin:
    image: "dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de"
    restart: "unless-stopped"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/pgadmin:/var/lib/pgadmin"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - "system_internal"
      - "internal"

networks:
  internal:
  system_internal:
    external: true
  system_mac_vlan:
    external: true

