services:

  app:
    image: "louislam/uptime-kuma:2.1.1"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
 #    ports:
 #      - "3001:3001"
    hostname: kuma.ioui.eu
    restart: always
    environment:
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: mariadb
      UPTIME_KUMA_DB_PORT: 3306
      UPTIME_KUMA_DB_NAME: kuma
      UPTIME_KUMA_DB_USERNAME: kuma
      UPTIME_KUMA_DB_PASSWORD: kuma
    env_file:
      - .env
    networks:
      default:
      system_internal:
      bookstack_default:

  mariadb:
    image: "mariadb:12.2.2-noble"
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: HEPGHL6w7RbPo7IfKZC2dZQObPKPqzMa
      MARIADB_DATABASE: kuma
      MARIADB_USER: kuma
      MARIADB_PASSWORD: kuma
    env_file:
      - .env
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/mysql:/var/lib/mysql"
    networks:
      default:

networks:
  default:
  system_internal:
    external: true
  bookstack_default:
    external: true


