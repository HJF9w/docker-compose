services:
  app:
    image: "grafana/grafana:13.1.1"
    restart: "unless-stopped"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    user: "472"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/grafana:/var/lib/grafana"
      - "./config.yml:/etc/influxdb2/config.yml"
      - "./grafana.ini:/etc/grafana/grafana.ini"
    networks:
      - "system_internal"

  db:
    image: "influxdb:2.9.1"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    ports:
      - "8086:8086"
    restart: "unless-stopped"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/influxdb:/var/lib/influxdb2"
    networks:
      - "system_internal"
      - "internal"

  postgres:
    image: "postgres:18.3-alpine3.23"
    restart: "unless-stopped"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/postgres:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      system_internal:
      internal:
      system_mac_vlan:
        ipv4_address: "${POSTGRES_EXT_IPV4}"

  pgadmin:
    image: "dpage/pgadmin4:2026-06-17-2"
    restart: "unless-stopped"
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/pgadmin:/var/lib/pgadmin"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - "system_internal"
      - "internal"

networks:
  internal:
  system_internal:
    external: true
  system_mac_vlan:
    external: true

