services:
  app:
    image: "portainer/portainer-ee:2.39.2"            ## opal is using the normal version, not alpine. last time I checkt you can't just switch between them.
    restart: always
    env_file:
      - secrets.enc.env
    #ports:
    #  - "8000:8000"
    #  - "9000:9000"
    environment: 
      TRUSTED_ORIGINS: portainer.ioui.eu
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/data"
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/compose:/data/compose/1"
    networks:
      system_mac_vlan:
        ipv4_address: "${EXT_IPV4}"
        mac_address: d2:cb:f3:62:49:0a
      system_internal:

  agent:
    image: 'portainer/agent:2.39.2-alpine'
    env_file:
      - secrets.enc.env
    environment:
      - EDGE_INSECURE_POLL=1
      - EDGE_KEY=${EDGE_KEY}
      - EDGE_ID=${EDGE_ID}
      - EDGE=1
    restart: always
    volumes:
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/portainer-agent-data:/data'
      - '/:/host'
      - '/var/lib/docker/volumes:/var/lib/docker/volumes'
      - '/var/run/docker.sock:/var/run/docker.sock'

networks:
  system_internal: ## now configured in doco-cd
    external: true
  system_mac_vlan:
    external: true
