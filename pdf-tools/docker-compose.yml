---
services:
  app:
    image: "stirlingtools/stirling-pdf:3.2.0-fat@sha256:b77d4fd0bb067bc03f0ca133ae551febaada9f1d0a1db915970dc0e35558dff3"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/trainingData:/usr/share/tesseract-ocr/4.00/tessdata" #Required for extra OCR languages
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/extraConfigs:/configs"
#      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/customFiles:/customFiles/"
    env_file:
      - ".env"
      - "secrets.enc.env"
    networks:
      system_internal:

networks:
  system_internal:
    external: true
