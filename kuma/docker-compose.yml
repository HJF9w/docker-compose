services:

  app:
    image: "louislam/uptime-kuma:2.5.7@sha256:4b95dbe7ac5343b768f8e04e3035ccd59997872b1a35ab9b0f082d2cc279070e"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
 #    ports:
 #      - "3001:3001"
    hostname: kuma.ioui.eu
    restart: always
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    networks:
      default:
      system_internal:
      bookstack_default:

  mariadb:
    image: "mariadb:12.3.3-noble@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf"
    restart: always
    logging:
      options:
        max-size: "10M"
        max-file: "3"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/mysql:/var/lib/mysql"
    networks:
      default:

networks:
  default:
  system_internal:
    external: true
  bookstack_default:
    external: true


