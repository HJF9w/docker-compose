services:
  db:
    image: "postgres:16-alpine3.22@sha256:786dab398303b8ce7cb76b407bb21ef2e4dfbbbd4c6abcf3d29b3130467ffdbc"
    restart: "unless-stopped"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/db:/var/lib/postgresql/data"
    networks:
      - "default"

  app:
    image: "vabene1111/recipes:2.6.15@sha256:2e759dd1478a2ed119ee474e28522079fb1cfa50b3fd25cba89f6b9a67abad72"
    restart: "unless-stopped"
    env_file:
      - ".env"
      - "secrets.enc.env"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/staticfiles:/opt/recipes/staticfiles"
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/mediafiles:/opt/recipes/mediafiles"
    depends_on:
      - "db"
    networks:
      - "default"
      - "system_internal"

networks:
  default:
  system_internal:
    external: true

