---
# Dashboard configuration
title: "ADS-B Tracking Hub"
subtitle: "Flight Feeders & Visualizations"
logo: "logo.png" # Optional: put a logo.png in the same directory
header: true
footer: false
columns: 3 # Lays out your 3 categories nicely on desktop
theme: default

colors:
  dark:
    highlight-primary: "#3366cc"
    highlight-secondary: "#0055ff"
    highlight-hover: "#5588ee"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#b3b3b3"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273f6"
    link-hover: "#f3f3f3"

