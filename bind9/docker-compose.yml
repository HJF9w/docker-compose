services:
  app:
    image: 'ubuntu/bind9:9.20-24.10_beta'
    environment:
      - BIND9_USER=root
      - TZ=Europe/Berlin
    volumes:
      - "$PWD/.config:/etc/bind"
      - "$PWD/.cache:/var/cache/bind"
      - "$PWD/.records:/var/lib/bind"
      - "$PWD/.log:/var/log"
    restart: always
    networks:
      system_mac_vlan:
        ipv4_address: "${EXT_IPV4}"
      system_internal:

networks:
  system_mac_vlan:
    external: true
  system_internal:
    external: true
