services:
  # ----------------------------------------------------------------------
  # COMMERCIAL & OTHER ADS-B FEEDERS
  # ----------------------------------------------------------------------
  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest-build-661
    container_name: piaware
    hostname: piaware
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file:
      - ".env"
      - "secrets.enc.env"
    ports:
      - 30105:30105
    networks:
      - caddy_to_adsb
      - default
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest-build-852
    container_name: fr24
    hostname: fr24
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file:
      - ".env"
      - "secrets.enc.env"
    ports:
      - 30108:30106
    networks:
      - caddy_to_adsb
      - default
    tmpfs:
      - /var/log

  pfclient:
    image: ghcr.io/sdr-enthusiasts/docker-planefinder:latest-build-536
    container_name: pfclient
    env_file:
      - ".env"
      - "secrets.enc.env"
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - caddy_to_adsb
      - default
    # Removed port 8084 to route via Caddy

  airnavradar:
    image: ghcr.io/sdr-enthusiasts/docker-airnavradar:latest-build-877
    container_name: airnavradar
    env_file:
      - ".env"
      - "secrets.enc.env"
    hostname: airnavradar
    restart: unless-stopped
    healthcheck:
      disable: true
    ports:
      - 30106:30105
    environment:
      - ALT=$${env.FEEDER_ALT_M}
    volumes: 
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/airnavradar:/sys/class/thermal:z
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  planewatch:
    image: ghcr.io/plane-watch/docker-plane-watch:v0.0.6
    container_name: planewatch
    env_file:
      - ".env"
      - "secrets.enc.env"
    hostname: planewatch
    restart: unless-stopped
    healthcheck:
      disable: true
    ports:
      - 30107:30105
    entrypoint: ["/bin/sh", "-c", "export ALT=$$FEEDER_ALT_FT; exec /init"]
    environment:
      - DEBUG_LOGGING=true
    tmpfs:
      - /run:exec,size=64M
      - /var/log

  opensky:
    image: ghcr.io/sdr-enthusiasts/docker-opensky-network:latest-build-831
    container_name: opensky
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file:
      - ".env"
      - "secrets.enc.env"
    environment:
      - DEBUG_LOGGING=true
      - ALT=$${env.FEEDER_ALT_M}
    tmpfs:
      - /run:exec,size=64M
      - /var/log

##  adsbhub: ## Website not working, couldn't get key
##    image: ghcr.io/sdr-enthusiasts/docker-adsbhub:latest-build-517
##    container_name: adsbhub
##    restart: unless-stopped
##    environment:
##      - SBSHOST=${FEEDER_IP}
##      - CLIENTKEY=${ADSBHUB_STATION_KEY}

  # ----------------------------------------------------------------------
  # VISUALIZATION
  # ----------------------------------------------------------------------
  planefence:
    image: ghcr.io/sdr-enthusiasts/docker-planefence:latest-build-1197
    container_name: planefence
    hostname: planefence
    env_file:
      - ".env"
      - "secrets.enc.env"
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - caddy_to_adsb
      - default
    environment:
      - ENABLE_WEB_CONFIG=true
      - PF_CONFIG_HTTP_PORT=9999
    volumes:
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/planefence/config:/usr/share/planefence/persist:z
      - ${BASEPATH}/${COMPOSE_PROJECT_NAME}/planefence/html:/usr/share/planefence/html:z
    tmpfs:
      - /run:rw,nosuid,nodev,exec,relatime,size=256M
      - /tmp:rw,nosuid,nodev,noexec,relatime,size=128M

