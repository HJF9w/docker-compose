---
services:
  app:
    image: "stirlingtools/stirling-pdf:3.1.0-fat@sha256:89534579a8d000b8275bc6398d093ed5e8a3ab77611173758c315c899a2105f3"
    volumes:
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/trainingData:/usr/share/tesseract-ocr/4.00/tessdata" #Required for extra OCR languages
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/extraConfigs:/configs"
#      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/customFiles:/customFiles/"
    env_file:
      - ".env"
      - "secrets.enc.env"
    networks:
      system_internal:

networks:
  system_internal:
    external: true
