services:
  dashboard:
    image: nginx:1.31.1-alpine3.23
    container_name: dashboard
    restart: unless-stopped
    env_file:
      - ".env"
      - "secrets.enc.env"
    networks:
      - caddy_to_adsb
    environment:
      - LOCAL_DOMAIN=${LOCAL_DOMAIN}
      - NGINX_ENVSUBST_OUTPUT_DIR=/usr/share/nginx/html
    volumes:
      - ./index.html.template:/etc/nginx/templates/index.html.template:z

networks:
  caddy_to_adsb:
    external: true
