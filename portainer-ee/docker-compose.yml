services:
  app:
    image: "portainer/portainer-ee:2.33.0-20250811-alpine"
    restart: always
    #ports:
    #  - "8000:8000"
    #  - "9000:9000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/data:/data"
      - "${BASEPATH}/${COMPOSE_PROJECT_NAME}/compose:/data/compose/1"
    networks:
      mac_vlan:
        ipv4_address: "${EXT_IPV4}"
      internal:

  agent:
    image: 'portainer/agent:2.32.0-alpine'
    environment:
      - EDGE_INSECURE_POLL=1
      - EDGE_KEY=${EDGE_KEY}
      - EDGE_ID=${EDGE_ID}
      - EDGE=1
    restart: always
    volumes:
      - '${BASEPATH}/${COMPOSE_PROJECT_NAME}/portainer-agent-data:/data'
      - '/:/host'
      - '/var/lib/docker/volumes:/var/lib/docker/volumes'
      - '/var/run/docker.sock:/var/run/docker.sock'


networks:
  internal:
    driver: "bridge"
  mac_vlan:
    driver: macvlan
    driver_opts:
      parent: "${MAC_VLAN_PARENT}"
    ipam:
      config:
      - subnet: "${IPAM_SUBNET}"
        gateway: "${IPAM_GATEWAY}"
        ip_range: "${IPAM_IP_RANGE}"
        aux_addresses:
          net_address: "${IPAM_NET_ADDRESS}"
